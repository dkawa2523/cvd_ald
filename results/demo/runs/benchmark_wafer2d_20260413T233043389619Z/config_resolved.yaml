sim:
  process: cvd
  time_mode: steady
  reference_plane:
    z_ref_mm: 1.0
  inputs:
    fluent:
      mode: steady
      file: C:\Users\user\Desktop\CVD_ALD\data\fluent_cvd_steady.npz
      io_loader_name: ''
      keys:
        cref: cref
        xy: xy
        time: time
        flux_sink: flux_sink
      species:
      - s0
      - s1
      - s2
      - s3
    temperature:
      mode: scalar
      value_K: 650.0
  domain:
    kind: from_fluent_xy
    xy_unit: mm
    wafer_radius_mm: 150.0
    nr: 64
    ntheta: 128
    nx: 128
    ny: 128
    edge_exclusion_mm: 0.0
  roles:
    mode: fixed
    A: s0
    I: null
    B: null
  model:
    name: aib_ode
    orders:
      adsorption_site_order: 1
      reaction_site_order_A: 1
      reaction_site_order_star: 0
      enforce_total_order_le: 3
    params:
      transport:
        km_source: fit_scalar
        km_A:
          mode: constant
          value: 0.02
        km_B:
          mode: constant
          value: 0.02
        Gamma_s: 1.0
        nu_A: 1.0
        gamma_km_A: 1.0
        gamma_km_B: 1.0
        from_cfd_flux_sink:
          eps_cref: 1.0e-12
          km_clip:
          - 1.0e-08
          - 10000.0
          flux_negative_policy: error
          units_hint: ''
      kinetics:
        k_ads: 1.0
        k_des: 0.1
        k_rxn: 0.01
      inhibitor:
        K_I: 0.0
      thickness:
        alpha_h: 1.0
      scaling:
        C_B_scale: 1.0
  time:
    t_proc_s: 30.0
    dt_s: 0.01
    solver:
      name: implicit_euler_bisect
      max_iter: 60
      theta_tol: 1.0e-10
  initial_conditions:
    theta_A:
      mode: scalar
      value: 0.0
    h_nm:
      mode: scalar
      value: 0.0
  measurement:
    enabled: false
    file: ''
    io_loader_name: ''
    keys:
      h: h_nm
      xy: xy
    align:
      enable: true
      shift_mm:
      - 0.0
      - 0.0
      rotate_deg: 0.0
      mask_radius_mm: 150.0
  output:
    project: demo
    run_name: benchmark_wafer2d
    root_dir: results
    store:
      format: npz
    save_fields:
    - h_nm
    - theta_A
    - theta_star
    - CsA_over_CrefA
    - f_I
    - residual_nm
    report:
      enabled: true
      index_html: true
