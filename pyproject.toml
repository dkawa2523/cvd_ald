[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deposim"
version = "0.1.0"
description = "Surface modeling simulation foundation for CVD/ALD."
readme = "README_HANDOFF.md"
requires-python = ">=3.10"
dependencies = [
  "hydra-core>=1.3,<2",
  "omegaconf>=2.3,<3",
  "numpy>=1.26,<3",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
jax = [
  "jax>=0.4,<1",
  "jaxlib>=0.4,<1",
]
clearml = [
  "clearml>=1.14,<2",
]
zarr = [
  "zarr>=2.17,<4",
]
hdf5 = [
  "h5py>=3.10,<4",
]
optuna = [
  "optuna>=3.6,<5",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["deposim_schema*", "deposim_sim*", "deposim_report*", "deposim_opt*", "deposim_tracking_clearml*"]
