defaults:
  - /sim: ald_state_min
  - _self_

# Minimal single-condition ALD role-state fitting config. For production-style
# role adoption, prefer the multi-condition config so role stability can be
# judged across shared tool/recipe/Fluent conditions.
opt:
  task: fit_roles_and_params

  measurement:
    file: data/meas_ald_final.npz
    keys: {h: h_nm, xy: xy}
    align: {enable: true, shift_mm: [0.0, 0.0], rotate_deg: 0.0, mask_radius_mm: 150.0}

  role_enumeration:
    enabled: true
    species_source: from_sim_input
    constraints: {disjoint: true, allow_unused: true}
    roles:
      A: {required: true, candidates: auto}
      I: {required: false, allow_none: true, max_size: 1, candidates: auto}
      B: {required: false, allow_none: true, max_size: 1, candidates: auto}

  order_enumeration:
    enabled: false
    candidates:
      - {adsorption_site_order: 1, reaction_site_order_A: 1, reaction_site_order_star: 0}
    enforce_total_order_le: 3

  class_compare:
    enabled: true
    classes: [A, AI, AB, AIB]

  parameter_fit:
    search:
      method: tpe
      seed: 123
      min_trials: 48
      max_trials: 192
      trials_per_dimension: 24
      patience: 48
      relative_improvement: 1.0e-4
      repetitions: 1
      pruner: none
      sampler_options: {n_startup_trials: 24, multivariate: true}
      storage: {url: "", study_name: "", load_if_exists: false}
    fidelity: {levels: [1]}
    objective:
      loss: {name: mse, standardized: auto}
      weights: {measurement: 1.0}
      penalties: {lambda_solver: 0.0, lambda_prior: 0.0}
      tie: {abs_score_epsilon: 1.0e-8}
    analysis:
      role_stability: {enabled: true, score_epsilon: 1.0e-6}
      identifiability: {enabled: false, relative_step: 1.0e-2, low_sensitivity_threshold: 1.0e-10, correlation_threshold: 0.98}
      cache: {enabled: true, max_entries: 256}
      preflight: {enabled: true, min_finite_ratio: 0.6}
    search_space:
      - {name: model.params.kinetics.k_store_A, type: loguniform, low: 1.0e-2, high: 1.0e+2}
      - {name: model.params.kinetics.k_release_A, type: loguniform, low: 1.0e-4, high: 1.0e+0}
      - {name: model.params.kinetics.k_convert_A, type: loguniform, low: 1.0e-3, high: 1.0e+1, condition: role_has_no_B}
      - {name: model.params.kinetics.k_convert_AB, type: loguniform, low: 1.0e-3, high: 1.0e+1, condition: role_has_B}
      - {name: model.params.inhibitor.k_store_I, type: loguniform, low: 1.0e-4, high: 1.0e+1, condition: role_has_I}
      - {name: model.params.inhibitor.k_release_I, type: loguniform, low: 1.0e-4, high: 1.0e+0, condition: role_has_I}
      - {name: model.params.thickness.alpha_h, type: loguniform, low: 1.0e-2, high: 1.0e+2}

  selection: {topk_overall: 20, topk_per_class: 10}

  output:
    project: demo
    run_name: fit_ald_state_min
    root_dir: results
    save: {ranking_csv: true, class_compare_csv: true, resolved_configs: true}
    report: {enabled: true, index_html: true}
