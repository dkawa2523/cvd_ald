defaults:
  - /sim: cvd_steady_min
  - _self_

opt:
  task: fit_roles_and_params

  measurement:
    keys: {h: h_nm, xy: xy}
    align: {enable: true, shift_mm: [0.0, 0.0], rotate_deg: 0.0, mask_radius_mm: 150.0}
    conditions:
      - name: base
        weight: 1.0
        fluent_file: runs/generated_inputs/multicond_fit/cvd_base_fluent.npz
        measurement_file: runs/generated_inputs/multicond_fit/cvd_base_meas.npz
        overrides: ["sim.time.t_proc_s=12.0", "sim.time.dt_s=0.02"]
      - name: high_feed
        weight: 1.0
        fluent_file: runs/generated_inputs/multicond_fit/cvd_high_feed_fluent.npz
        measurement_file: runs/generated_inputs/multicond_fit/cvd_high_feed_meas.npz
        overrides: ["sim.time.t_proc_s=12.0", "sim.time.dt_s=0.02"]
      - name: edge_depleted
        split: holdout
        weight: 1.0
        fluent_file: runs/generated_inputs/multicond_fit/cvd_edge_depleted_fluent.npz
        measurement_file: runs/generated_inputs/multicond_fit/cvd_edge_depleted_meas.npz
        overrides: ["sim.time.t_proc_s=12.0", "sim.time.dt_s=0.02"]

  role_enumeration:
    enabled: true
    species_source: from_sim_input
    constraints: {disjoint: true, allow_unused: true}
    roles:
      A: {required: true, candidates: [s0, s1]}
      I: {required: false, allow_none: true, max_size: 1, candidates: [s2]}
      B: {required: false, allow_none: true, max_size: 1, candidates: [s1]}

  order_enumeration:
    enabled: false
    candidates:
      - {adsorption_site_order: 1, reaction_site_order_A: 1, reaction_site_order_star: 0}
    enforce_total_order_le: 3

  class_compare:
    enabled: true
    classes: [A, AI, AB, AIB]

  parameter_fit:
    search:
      method: tpe
      seed: 123
      min_trials: 32
      max_trials: 128
      trials_per_dimension: 24
      patience: 32
      relative_improvement: 1.0e-4
      repetitions: 1
      pruner: none
      sampler_options: {n_startup_trials: 16, multivariate: true}
      storage: {url: "", study_name: "", load_if_exists: false}
    fidelity: {levels: [1, 2]}
    objective:
      loss: {name: mse, standardized: auto}
      weights: {measurement: 1.0}
      penalties: {lambda_solver: 0.0, lambda_prior: 0.0}
      tie: {abs_score_epsilon: 1.0e-8}
    analysis:
      role_stability: {enabled: true, score_epsilon: 1.0e-6}
      identifiability: {enabled: true, relative_step: 1.0e-2, low_sensitivity_threshold: 1.0e-10, correlation_threshold: 0.98}
      cache: {enabled: true, max_entries: 256}
      preflight: {enabled: true, min_finite_ratio: 0.6}
    search_space:
      - {name: model.params.kinetics.k_rxn, type: loguniform, low: 1.0e-3, high: 1.0e+0, group: surface_kinetics, stage: calibration}
      - {name: model.params.transport.km_A, type: loguniform, low: 1.0e-3, high: 1.0e+0, group: effective_transport, stage: calibration}
      - {name: model.params.transport.km_B, type: loguniform, low: 1.0e-3, high: 1.0e+0, condition: role_has_B, group: effective_transport, stage: calibration}
      - {name: model.params.inhibitor.K_I, type: loguniform, low: 1.0e-4, high: 1.0e+2, condition: role_has_I, group: surface_kinetics, stage: calibration}

  selection: {topk_overall: 20, topk_per_class: 10}

  output:
    project: demo
    run_name: fit_cvd_multicond_min
    root_dir: results
    save: {ranking_csv: true, class_compare_csv: true, resolved_configs: true}
    report: {enabled: true, index_html: true}
