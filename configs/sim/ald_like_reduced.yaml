sim:
  process: ald
  time_mode: transient

  # Diagnostic benchmark config. This is not the production ALD role-assimilation
  # path; use `ald_state_min.yaml` for ALD role-state work.

  reference_plane:
    z_ref_mm: 1.0

  inputs:
    fluent:
      mode: transient
      file: data/ald_like_reduced/ald_like_nominal.npz
      keys:
        cref: cref
        xy: xy
        time: time
        flux_sink: flux_sink
      species: [s0, s1, s2, s3]
    temperature:
      mode: scalar
      value_K: 550.0

  domain:
    kind: from_fluent_xy
    xy_unit: mm
    wafer_radius_mm: 150.0
    edge_exclusion_mm: 0.0

  roles:
    mode: fixed
    A: s0
    I: null
    B: s1

  model:
    name: role_ald_compat
    orders:
      adsorption_site_order: 1
      reaction_site_order_A: 1
      reaction_site_order_star: 1
      enforce_total_order_le: 3
    params:
      transport:
        km_source: fit_scalar
        km_A: {mode: constant, value: 0.02}
        km_B: {mode: constant, value: 0.02}
        Gamma_s: 1.0
        nu_A: 1.0
        gamma_km_A: 1.0
        gamma_km_B: 1.0
        from_cfd_flux_sink:
          eps_cref: 1.0e-12
          km_clip: [1.0e-8, 1.0e4]
          flux_negative_policy: error
          units_hint: "synthetic arbitrary units"
      kinetics:
        k_ads: 2.0
        k_des: 0.05
        k_rxn: 0.025
      inhibitor:
        K_I: 0.0
      thickness:
        alpha_h: 138.0
      scaling:
        C_B_scale: 1.0

  time:
    t_proc_s: 4.0
    dt_s: 0.005
    solver:
      name: implicit_euler_bisect
      max_iter: 60
      theta_tol: 1.0e-10

  initial_conditions:
    theta_A: {mode: scalar, value: 0.0}
    h_nm: {mode: scalar, value: 0.0}

  measurement:
    enabled: true
    file: data/ald_like_reduced/ald_like_nominal_meas.npz
    keys:
      h: h_nm
      xy: xy
    align:
      enable: false

  output:
    project: demo
    run_name: ald_like_reduced
    root_dir: results
    store: {format: npz}
    save_fields: [h_nm, theta_A, theta_star, CsA_over_CrefA, CsB_over_CrefB, phi_B, f_I, residual_nm]
    report: {enabled: true, index_html: true}
