sim:
  process: ald
  time_mode: transient

  reference_plane:
    z_ref_mm: 1.0

  inputs:
    fluent:
      mode: transient
      file: data/fluent_ald_transient.npz
      keys:
        cref: cref
        xy: xy
        time: time
      species: [s0, s1, s2, s3]
    temperature:
      mode: scalar
      value_K: 550.0

  domain:
    kind: from_fluent_xy
    xy_unit: mm
    wafer_radius_mm: 150.0

  roles:
    mode: fixed
    A: s0
    I: null
    B: s1

  model:
    name: aib_ode
    orders:
      adsorption_site_order: 1
      reaction_site_order_A: 1
      reaction_site_order_star: 0
      enforce_total_order_le: 3
    params:
      transport:
        km_A: {mode: constant, value: 0.02}
        km_B: {mode: constant, value: 0.02}
        Gamma_s: 1.0
        nu_A: 1.0
      kinetics:
        k_ads: 1.0
        k_des: 0.1
        k_rxn: 0.01
      inhibitor: {K_I: 0.0}
      thickness: {alpha_h: 1.0}
      scaling: {C_B_scale: 1.0}

  time:
    t_proc_s: 30.0
    dt_s: 0.001
    solver:
      name: implicit_euler_bisect
      max_iter: 60
      theta_tol: 1.0e-10

  initial_conditions:
    theta_A: {mode: scalar, value: 0.0}
    h_nm: {mode: scalar, value: 0.0}

  output:
    project: demo
    run_name: ald_transient_min
    root_dir: results
    store: {format: npz}
    save_fields: [h_nm, theta_A, theta_star, CsA_over_CrefA, CsB_over_CrefB, phi_B, residual_nm]
    report: {enabled: true, index_html: true}
