# Codex CLI configuration snippet (template)
# This file is intentionally conservative because Codex CLI versions differ.
# scripts/codex_autorun.py will attempt to pass this file via `codex exec --config` if supported.

# Adjust keys/structure to match your Codex CLI version if needed.

[exec]
model = "gpt-5.2-codex"
reasoning = "high"
# workspace should be write-enabled. Different versions may use:
# - workspace = "write"
# - workspace_write = true
# - read_only = false
workspace = "write"
